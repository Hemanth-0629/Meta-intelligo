<svg viewBox="0 0 260 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- M-shaped antenna mark matching metaintelligo.com brand -->
  <g>
    <!-- Left outer bar -->
    <polygon points="2,38 10,6 15,6 7,38" fill="white"/>
    <!-- Left inner bar -->
    <polygon points="14,38 22,12 27,12 19,38" fill="white"/>
    <!-- Center peak bar (tallest) -->
    <polygon points="24,38 32,2 37,2 29,38" fill="white"/>
    <!-- Right inner bar -->
    <polygon points="34,38 42,12 47,12 39,38" fill="white"/>
    <!-- Right outer bar -->
    <polygon points="44,38 52,6 57,6 49,38" fill="white"/>
    <!-- Dot accents at tops -->
    <circle cx="12.5" cy="4.5" r="2.5" fill="white"/>
    <circle cx="24.5" cy="10" r="2.5" fill="white"/>
    <circle cx="34.5" cy="0.5" r="2.5" fill="white"/>
    <circle cx="44.5" cy="10" r="2.5" fill="white"/>
    <circle cx="53" cy="4.5" r="2.5" fill="white"/>
  </g>
  <!-- Divider -->
  <line x1="70" y1="10" x2="70" y2="34" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- META INTELLIGO wordmark -->
  <text x="80" y="27" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="white" letter-spacing="3">META INTELLIGO</text>
</svg>
